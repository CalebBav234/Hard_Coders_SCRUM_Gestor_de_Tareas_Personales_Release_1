<div class="task-form">

  <div class="form-header">
    <h2>Crear nueva tarea</h2>
    <p>Agrega una tarea pendiente a tu lista.</p>
  </div>

  <div class="form-group">

    <label for="title">Título de la tarea</label>

    <input
      id="title"
      type="text"
      placeholder="Ej. Estudiar para el examen"
      [(ngModel)]="title"
      [disabled]="loading"
    >

    @if (submitted && title.trim() === '') {
      <p class="error-message">
        El título es obligatorio.
      </p>
    }

  </div>

  <div class="form-group">
    <label for="priority">Prioridad</label>
    <select id="priority" [(ngModel)]="selectedPriority" [disabled]="loading">
      <option value="ALTA">Alta</option>
      <option value="MEDIA">Media</option>
      <option value="BAJA">Baja</option>
    </select>
  </div>

  <div class="form-group">
    <label for="category">Categoría</label>
    <input
      id="category"
      type="text"
      placeholder="Ej. Trabajo (deja vacío para Sin categoría)"
      maxlength="80"
      [(ngModel)]="selectedCategoryName"
      [disabled]="loading"
    >
  </div>

  @if (error) {
    <p class="error-message">{{ error }}</p>
  }

  <button type="button" (click)="crearTarea()" [disabled]="loading">
    {{ loading ? 'Creando...' : 'Crear tarea' }}
  </button>

</div>
