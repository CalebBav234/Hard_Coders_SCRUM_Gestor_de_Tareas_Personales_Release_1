spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/gestor_tareas?currentSchema=task_manager}
    username: ${SPRING_DATASOURCE_USERNAME:gestor_tareas_app}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: task_manager
        jdbc:
          time_zone: UTC

  sql:
    init:
      mode: never

server:
  port: 8080

app:
  security:
    jwt:
      # Solo para desarrollo. En cualquier entorno compartido define APP_JWT_SECRET (>= 32 caracteres).
      secret: ${APP_JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
      expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:480}
      issuer: gestor-tareas
