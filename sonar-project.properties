# ==========================================================
# SonarQube - Gestor de Tareas Personales
# ==========================================================

# Identificación del proyecto
sonar.projectKey=hard-coders-gestor-tareas
sonar.projectName=Gestor de Tareas Personales

# Servidor SonarQube local
sonar.host.url=http://localhost:9000

# CodificaciÃ³n
sonar.sourceEncoding=UTF-8

# ==========================================================
# FUENTES DE LA APLICACIÓN
# ==========================================================

sonar.sources=backend/src/main/java,frontend/src

# ==========================================================
# TESTS
# ==========================================================

sonar.tests=backend/src/test/java,frontend/src

sonar.test.inclusions=**/*Test.java,**/*Tests.java,frontend/src/**/*.spec.ts,frontend/src/**/*.test.ts

# ==========================================================
# BYTECODE JAVA
# ==========================================================

sonar.java.binaries=backend/target/classes
sonar.java.test.binaries=backend/target/test-classes

# El escáner se ejecuta en Linux/Docker mientras el repositorio puede ser un
# worktree de Windows. Desactivar SCM evita rutas Git de Windows no montadas.
# No cambia fuentes, reglas ni las métricas de calidad de A1/A2/A3.
sonar.scm.disabled=true

# ==========================================================
# EXCLUSIONES DE ARCHIVOS GENERADOS / DEPENDENCIAS
# ==========================================================

sonar.exclusions=**/node_modules/**,**/.angular/**,**/dist/**,**/target/**,frontend/src/**/*.spec.ts,frontend/src/**/*.test.ts
